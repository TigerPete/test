apiVersion: batch/v1
kind: Job
metadata:
  name: rag-ingest
  namespace: rag
  labels:
    app.kubernetes.io/name: rag-ingest
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-ingest
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-ollama
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://ollama.rag.svc.cluster.local:11434/ >/dev/null 2>&1; do
                echo "waiting for ollama..."
                sleep 3
              done
              echo "ollama is up"
      containers:
        - name: ingest
          image: rag-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rag-agent-config
          command:
            - python
            - -m
            - rag_agent.main
            - ingest
            - --reset
          volumeMounts:
            - name: rag-data
              mountPath: /app/data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "4"
      volumes:
        - name: rag-data
          persistentVolumeClaim:
            claimName: rag-data
