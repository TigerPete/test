apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-agent-config
  namespace: rag
  labels:
    app.kubernetes.io/name: rag-agent
data:
  OLLAMA_HOST: "http://ollama.rag.svc.cluster.local:11434"
  CHAT_MODEL: "llama3.2:3b"
  EMBED_MODEL: "nomic-embed-text"
  CHAT_TEMPERATURE: "0.3"
  CHAT_NUM_CTX: "8192"
  RETRIEVAL_K: "16"
  CHUNK_SIZE: "1800"
  CHUNK_OVERLAP: "350"
  DATA_DIR: "/app/data/documents"
  CHROMA_DIR: "/app/data/chroma_db"
  COLLECTION_NAME: "rag_documents"
