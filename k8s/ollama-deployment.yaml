apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: rag
  labels:
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "4Gi"
              cpu: "500m"
            limits:
              memory: "8Gi"
              cpu: "4"
          # Uncomment for NVIDIA GPU nodes:
          # resources:
          #   limits:
          #     nvidia.com/gpu: "1"
      volumes:
        - name: ollama-models
          emptyDir: {}
